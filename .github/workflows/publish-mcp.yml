name: Publish MCP Registry

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install mcp-publisher
        run: |
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          ARCH=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_${OS}_${ARCH}.tar.gz" \
            | tar xz mcp-publisher
          sudo install -m 755 mcp-publisher /usr/local/bin/mcp-publisher
          mcp-publisher --version

      # server.json is the whole-server entry (dev.1social/1social); servers/<network>/server.json
      # are the per-network entries. All share one version, so one tag publishes every one of them.
      - name: Validate
        run: |
          for f in server.json servers/*/server.json; do
            echo "::group::$f"
            mcp-publisher validate "$f"
            echo "::endgroup::"
          done

      # DNS auth, not GitHub auth: the namespace is `dev.1social/...`, which is proved by a TXT
      # record on 1social.dev carrying the public half of MCP_PRIVATE_KEY.
      - name: Login (DNS)
        env:
          MCP_PRIVATE_KEY: ${{ secrets.MCP_PRIVATE_KEY }}
        run: mcp-publisher login dns --domain 1social.dev --private-key "$MCP_PRIVATE_KEY"

      - name: Publish
        run: |
          for f in server.json servers/*/server.json; do
            echo "::group::$f"
            mcp-publisher publish "$f"
            echo "::endgroup::"
          done
